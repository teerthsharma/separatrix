<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586" width="900" height="586" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="900" height="586" rx="8" fill="#0d1117"/>
  <text x="24" y="40" fill="#58a6ff" font-size="12.5" font-weight="normal" text-anchor="start">$ separatrix demo --frame cancellation</text>
  <text x="24" y="58" fill="#30363d" font-size="12.5" font-weight="normal" text-anchor="start">==============================================================================</text>
  <text x="24" y="76" fill="#e6edf3" font-size="12.5" font-weight="normal" text-anchor="start">  frame 1 -- cancellation.  x = (1e6, 0)   y = (1e6 + 1e-6, 0)   float64</text>
  <text x="24" y="94" fill="#30363d" font-size="12.5" font-weight="normal" text-anchor="start">==============================================================================</text>
  <text x="24" y="112" fill="#e6edf3" font-size="12.5" font-weight="normal" text-anchor="start">  float32 collapses the pair:  np.float32(1e6+1e-6) == np.float32(1e6) is True</text>
  <text x="24" y="130" fill="#e6edf3" font-size="12.5" font-weight="normal" text-anchor="start">  gram identity  ||x||^2+||y||^2-2&lt;x,y&gt;   = 0.0</text>
  <text x="24" y="148" fill="#e6edf3" font-size="12.5" font-weight="normal" text-anchor="start">  direct sum     sum_l (x_l - y_l)^2      = 1.0000152290447206e-12</text>
  <text x="24" y="166" fill="#e6edf3" font-size="12.5" font-weight="normal" text-anchor="start">  exact, scaled integers                  = 1.0000152290447206e-12</text>
  <text x="24" y="184" fill="#30363d" font-size="12.5" font-weight="normal" text-anchor="start">------------------------------------------------------------------------------</text>
  <text x="24" y="202" fill="#e6edf3" font-size="12.5" font-weight="normal" text-anchor="start">  gram    radius 1.776357e-03   nearest-neighbour decision not determined</text>
  <text x="24" y="220" fill="#e6edf3" font-size="12.5" font-weight="normal" text-anchor="start">  direct  radius 8.399116e-323   nearest-neighbour decision determined</text>
  <text x="24" y="238" fill="#30363d" font-size="12.5" font-weight="normal" text-anchor="start">==============================================================================</text>
  <text x="24" y="256" fill="#d29922" font-size="12.5" font-weight="normal" text-anchor="start">  REFUSED (GRAM_CANCELLATION)                                 0/1 determined</text>
  <text x="24" y="274" fill="#30363d" font-size="12.5" font-weight="normal" text-anchor="start">==============================================================================</text>
  <text x="24" y="292" fill="#e6edf3" font-size="12.5" font-weight="normal" text-anchor="start">  computed    kernel gram   bound cheap   per-row   k 1</text>
  <text x="24" y="310" fill="#e6edf3" font-size="12.5" font-weight="normal" text-anchor="start">  dtype       float64</text>
  <text x="24" y="328" fill="#e6edf3" font-size="12.5" font-weight="normal" text-anchor="start">  canary      numpy/float64 clean</text>
  <text x="24" y="346" fill="#e6edf3" font-size="12.5" font-weight="normal" text-anchor="start">  accumulator assumed storage dtype (P5 is not testable)</text>
  <text x="24" y="364" fill="#30363d" font-size="12.5" font-weight="normal" text-anchor="start">------------------------------------------------------------------------------</text>
  <text x="24" y="382" fill="#e6edf3" font-size="12.5" font-weight="normal" text-anchor="start">  boundary    row 0: in #0 [-1.776357e-03, 1.776357e-03]  out #1</text>
  <text x="24" y="400" fill="#8b949e" font-size="12.5" font-weight="normal" text-anchor="start">              [-1.776357e-03, 1.776357e-03]  gap 0.000000e+00  width</text>
  <text x="24" y="418" fill="#8b949e" font-size="12.5" font-weight="normal" text-anchor="start">              3.552714e-03  deficit -3.552714e-03</text>
  <text x="24" y="436" fill="#30363d" font-size="12.5" font-weight="normal" text-anchor="start">------------------------------------------------------------------------------</text>
  <text x="24" y="454" fill="#8b949e" font-size="12.5" font-weight="normal" text-anchor="start">  next        The direct kernel separates this pair; the Gram identity does</text>
  <text x="24" y="472" fill="#8b949e" font-size="12.5" font-weight="normal" text-anchor="start">              not. Pass kernel='direct', or torch.cdist(...,</text>
  <text x="24" y="490" fill="#8b949e" font-size="12.5" font-weight="normal" text-anchor="start">              compute_mode='donot_use_mm_for_euclid_dist'), or</text>
  <text x="24" y="508" fill="#8b949e" font-size="12.5" font-weight="normal" text-anchor="start">              scipy.spatial.distance.cdist for these queries. torch.cdist</text>
  <text x="24" y="526" fill="#8b949e" font-size="12.5" font-weight="normal" text-anchor="start">              switches to the Gram identity above 25 rows, and this refusal</text>
  <text x="24" y="544" fill="#8b949e" font-size="12.5" font-weight="normal" text-anchor="start">              names that switch as the cause.</text>
  <text x="24" y="562" fill="#30363d" font-size="12.5" font-weight="normal" text-anchor="start">==============================================================================</text>
</svg>
